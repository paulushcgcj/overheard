[project]
name = "overheard"
version = "0.1.0"
description = "Self-hosted audio intelligence endpoint: transcription, speaker diarization and text embeddings in one tiny CPU-only container"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Paulo Gomes da Cruz Junior" }]
keywords = ["whisper", "speech-to-text", "speaker-diarization", "embeddings", "fastapi"]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "faster-whisper>=1.1,<2",
  "av<14",                       # faster-whisper 1.2 breaks with PyAV>=14 (metadata_errors kwarg)
  "ctranslate2>=4.5",
  "numpy>=1.24",
  "scipy>=1.11",
  "onnxruntime>=1.17",
  "huggingface-hub>=0.23",
  "tokenizers>=0.19",
  "pydantic>=2.7",
]

[project.optional-dependencies]
pyannote = [
  "pyannote.audio>=3.3",
  "torch>=2.2",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.6",
]

[project.scripts]
overheard = "overheard.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/overheard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "model: test downloads real models (~200 MB) and runs inference",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"src/overheard/server.py" = ["B008"]  # File(...)/Form(...) defaults are FastAPI idiom
